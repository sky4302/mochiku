name: Build Mochiku APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Mochiku APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Optimized Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Output APKs
        run: |
          mkdir -p output_apk
          echo "=== All APKs generated by Gradle ==="
          ls -la app/build/outputs/apk/release/
          
          # Copy universal APK
          find app/build/outputs/apk/release -name "*universal*.apk" -exec cp {} output_apk/Mochiku-Universal.apk \;
          
          # Copy arm64-v8a APK (Modern 64-bit phones)
          find app/build/outputs/apk/release -name "*arm64-v8a*.apk" -exec cp {} output_apk/Mochiku-arm64-v8a.apk \;
          
          # Copy armeabi-v7a APK (Older 32-bit phones)
          find app/build/outputs/apk/release -name "*armeabi-v7a*.apk" -exec cp {} output_apk/Mochiku-armeabi-v7a.apk \;
          
          # Copy x86_64 APK (PC Emulators)
          find app/build/outputs/apk/release -name "*x86_64*.apk" -exec cp {} output_apk/Mochiku-x86_64.apk \;

          # Fallback: if Universal APK wasn't named universal, copy first APK as Universal
          if [ ! -f output_apk/Mochiku-Universal.apk ]; then
            first_apk=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            cp "$first_apk" output_apk/Mochiku-Universal.apk
          fi

          # Also create Mochiku-Release.apk and Mochiku-Debug.apk so all download URLs remain valid
          cp output_apk/Mochiku-Universal.apk output_apk/Mochiku-Release.apk
          cp output_apk/Mochiku-Universal.apk output_apk/Mochiku-Debug.apk

          echo "=== Prepared APKs for distribution ==="
          ls -lh output_apk/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mochiku-APKs
          path: output_apk/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.14.13
          name: Mochiku v1.14.13
          body: |
            ### Mochiku (餅ク) v1.14.13 - Dynamic Theming & Light Theme Legibility
            Mochiku is an honest open-source community fork of [Komikku](https://github.com/komikku-app/komikku) (built upon Tachiyomi and Mihon).
            
            **What's New in v1.14.13:**
            - **Theme-Adaptive Profile ID Card**: The ID Card now dynamically adapts to all app themes (Sakura, Lavender, Peach, Teal, Material You) in both Light and Dark modes.
            - **Light Mode Recap Legibility Fix**: Fixed invisible white-on-white text in Story Recap slides (`"Again and again"`, `"Let's see your bill"`, chapters read subtitle, etc.) so all slides are high contrast and crystal clear in Light Theme.
            - **Thermal Receipt Edge Border**: Added subtle edge border definition to the vintage thermal receipt so it stands out cleanly against pure white backgrounds.
            - **In-App Updater Enabled**: Directly check for updates and update inside the app.
            
            ---
            ### Download Links (Choose for your phone):
            - **Universal (Recommended - Works on ALL Android devices)**: [`Mochiku-Universal.apk`](https://github.com/sky4302/mochiku/releases/latest/download/Mochiku-Universal.apk)
            - **ARM64-v8a (Modern 64-bit phones - Samsung, Xiaomi, Pixel, etc.)**: [`Mochiku-arm64-v8a.apk`](https://github.com/sky4302/mochiku/releases/latest/download/Mochiku-arm64-v8a.apk)
            - **ARMv7 (Older 32-bit phones)**: [`Mochiku-armeabi-v7a.apk`](https://github.com/sky4302/mochiku/releases/latest/download/Mochiku-armeabi-v7a.apk)
            - **x86_64 (PC Emulators / WSA / Bluestacks)**: [`Mochiku-x86_64.apk`](https://github.com/sky4302/mochiku/releases/latest/download/Mochiku-x86_64.apk)
          files: output_apk/*.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
