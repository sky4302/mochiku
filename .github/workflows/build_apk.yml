name: Build Mochiku APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Mochiku APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Output APKs
        run: |
          mkdir -p output_apk
          echo "=== All APKs generated by Gradle ==="
          ls -la app/build/outputs/apk/debug/
          
          # Copy universal APK
          find app/build/outputs/apk/debug -name "*universal*.apk" -exec cp {} output_apk/Mochiku-Universal.apk \;
          
          # Copy arm64-v8a APK (Modern 64-bit phones)
          find app/build/outputs/apk/debug -name "*arm64-v8a*.apk" -exec cp {} output_apk/Mochiku-arm64-v8a.apk \;
          
          # Copy armeabi-v7a APK (Older 32-bit phones)
          find app/build/outputs/apk/debug -name "*armeabi-v7a*.apk" -exec cp {} output_apk/Mochiku-armeabi-v7a.apk \;
          
          # Copy x86_64 APK (PC Emulators)
          find app/build/outputs/apk/debug -name "*x86_64*.apk" -exec cp {} output_apk/Mochiku-x86_64.apk \;

          # Fallback: if Universal APK wasn't named universal, copy first APK as Universal
          if [ ! -f output_apk/Mochiku-Universal.apk ]; then
            first_apk=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
            cp "$first_apk" output_apk/Mochiku-Universal.apk
          fi

          # Also create Mochiku-Debug.apk as identical to Universal so standard links always work
          cp output_apk/Mochiku-Universal.apk output_apk/Mochiku-Debug.apk

          echo "=== Prepared APKs for distribution ==="
          ls -lh output_apk/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mochiku-APKs
          path: output_apk/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-preview
          name: Mochiku v1.0.0-preview
          body: |
            ### 🍡 Mochiku (餅ク) v1.0.0 Preview
            True Komikku Android Fork with Mochy-Music OLED dark theme and Manga Recap Gimmick.
            
            - **OLED Dark Theme**: `#000000` true black, neutral gray typography, zero colorful gradients.
            - **Manga Recap Gimmick**: Monthly/Yearly range, Barcode unlock card, 24-Hour reading activity histogram, 7-Day weekly tempo.
            - **100% Native Komikku Functions**: Extensions, Sources, Library categories, RTL/LTR/Webtoon readers, Trackers, Downloads.
            
            ---
            ### 📱 Download Links (Choose for your phone):
            - **Universal (Recommended - Works on ALL Android devices)**: [`Mochiku-Universal.apk`](https://github.com/sky4302/mochiku/releases/download/v1.0.0-preview/Mochiku-Universal.apk)
            - **ARM64-v8a (Modern 64-bit phones - Samsung, Xiaomi, Pixel, etc.)**: [`Mochiku-arm64-v8a.apk`](https://github.com/sky4302/mochiku/releases/download/v1.0.0-preview/Mochiku-arm64-v8a.apk)
            - **ARMv7 (Older 32-bit phones)**: [`Mochiku-armeabi-v7a.apk`](https://github.com/sky4302/mochiku/releases/download/v1.0.0-preview/Mochiku-armeabi-v7a.apk)
            - **x86_64 (PC Emulators / WSA / Bluestacks)**: [`Mochiku-x86_64.apk`](https://github.com/sky4302/mochiku/releases/download/v1.0.0-preview/Mochiku-x86_64.apk)
          files: output_apk/*.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
