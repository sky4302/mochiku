name: Build Mochiku APK

on:
  push:
    branches:
      - main
      - master
      - beta
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Mochiku APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Domain Unit Tests
        run: ./gradlew :domain:testReleaseUnitTest --stacktrace

      - name: Build Optimized Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Output APKs
        run: |
          mkdir -p output_apk
          echo "=== All APKs generated by Gradle ==="
          ls -la app/build/outputs/apk/release/
          
          # Copy universal APK
          find app/build/outputs/apk/release -name "*universal*.apk" -exec cp {} output_apk/Mochiku-Universal.apk \;
          
          # Copy arm64-v8a APK (Modern 64-bit phones)
          find app/build/outputs/apk/release -name "*arm64-v8a*.apk" -exec cp {} output_apk/Mochiku-arm64-v8a.apk \;
          
          # Copy armeabi-v7a APK (Older 32-bit phones)
          find app/build/outputs/apk/release -name "*armeabi-v7a*.apk" -exec cp {} output_apk/Mochiku-armeabi-v7a.apk \;
          
          # Copy x86_64 APK (PC Emulators)
          find app/build/outputs/apk/release -name "*x86_64*.apk" -exec cp {} output_apk/Mochiku-x86_64.apk \;

          # Fallback: if Universal APK wasn't named universal, copy first APK as Universal
          if [ ! -f output_apk/Mochiku-Universal.apk ]; then
            first_apk=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            cp "$first_apk" output_apk/Mochiku-Universal.apk
          fi

          # Also create Mochiku-Release.apk and Mochiku-Debug.apk so all download URLs remain valid
          cp output_apk/Mochiku-Universal.apk output_apk/Mochiku-Release.apk
          cp output_apk/Mochiku-Universal.apk output_apk/Mochiku-Debug.apk

          echo "=== Prepared APKs for distribution ==="
          ls -lh output_apk/

      - name: Upload ARM64 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mochiku-arm64-v8a
          path: output_apk/Mochiku-arm64-v8a.apk
          retention-days: 30

      - name: Upload All APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mochiku-APKs
          path: output_apk/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v1.14.29
          name: Mochiku v1.14.29
          body: |
            ### Mochiku (餅ク) v1.14.29 - Crisp Dark Mode Dot Matrix, Full Cover Grid & Clean Roulette
            Mochiku is an honest open-source community fork of [Komikku](https://github.com/komikku-app/komikku) (built upon Tachiyomi and Mihon).
            
            **What's New in v1.14.29:**
            - **Dark Mode Dot-Matrix Contrast**: Replaced the dim `outlineVariant` dot alpha with a shared luminance-aware `mochikuDotColor` / `mochikuDotMatrix` backdrop helper across the More hero header, Story Recap overlay, and 9:16 Share Cards so dots remain visible in OLED Dark and Light themes.
            - **Full 12-Tile Cover Grid**: Removed the blank right-column placeholder slots in `RecapCoverGridSlide` so all 12 tilted tiles display real covers while keeping `#1` exclusive to the centered spotlight tile.
            - **Deduplicated Roulette Spin**: Reserved `#1` strictly for landing slot `0` when multiple series were read this month, eliminating the mid-spin `#1` duplicate flash.
            
            ---
            ### Download Links (Choose for your phone):
            - **Universal (Recommended - Works on ALL Android devices)**: [`Mochiku-Universal.apk`](https://github.com/sky4302/mochiku/releases/latest/download/Mochiku-Universal.apk)
            - **ARM64-v8a (Modern 64-bit phones - Samsung, Xiaomi, Pixel, etc.)**: [`Mochiku-arm64-v8a.apk`](https://github.com/sky4302/mochiku/releases/latest/download/Mochiku-arm64-v8a.apk)
            - **ARMv7 (Older 32-bit phones)**: [`Mochiku-armeabi-v7a.apk`](https://github.com/sky4302/mochiku/releases/latest/download/Mochiku-armeabi-v7a.apk)
            - **x86_64 (PC Emulators / WSA / Bluestacks)**: [`Mochiku-x86_64.apk`](https://github.com/sky4302/mochiku/releases/latest/download/Mochiku-x86_64.apk)
          files: output_apk/*.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
